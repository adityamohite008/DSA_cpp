<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AttendX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AttendX · Attendance Tracker</title>
<style>
:root{--bg:#eef0ff;--card:#fff;--tx:#161a33;--mu:#5d6592;--bd:#dfe2f5;--ac:#6d4aff;--ac2:#06b6d4;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--in:#f6f7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141a30;--tx:#e8ecff;--mu:#8d97c4;--bd:#252c4d;--in:#0f1428}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141a30;--tx:#e8ecff;--mu:#8d97c4;--bd:#252c4d;--in:#0f1428}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(600px 400px at 10% -10%,rgba(109,74,255,.35),transparent),radial-gradient(500px 400px at 100% 0,rgba(6,182,212,.28),transparent);background-attachment:fixed}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(20,20,60,.08)}
h1,h2,h3{margin:0}
.logo{font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;margin:6px 0 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
label{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
button{font:inherit;min-height:46px;touch-action:manipulation;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2))}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:9px 14px;font-size:14px;min-height:42px}
button.danger{background:var(--bad)}
button.pr{background:var(--ok)}button.ab{background:var(--bad)}
button.pr.o{background:transparent;color:var(--ok);border:1px solid var(--ok)}button.ab.o{background:transparent;color:var(--bad);border:1px solid var(--bad)}
button.un{background:var(--warn);color:#1a1a1a}button:disabled{opacity:.4;cursor:not-allowed}
.full{width:100%}
.auth{max-width:420px;margin:6vh auto 0}
.tabs{display:flex;gap:6px;margin:14px 0;overflow-x:auto}
.tab{background:var(--card);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.tab.on{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:140px;height:140px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.ok{background:rgba(16,185,129,.15);color:var(--ok)}.bad{background:rgba(239,68,68,.15);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.sub{padding:14px;border:1px solid var(--bd);border-radius:14px;background:var(--in)}
.bar{height:9px;border-radius:9px;background:var(--bd);margin:10px 0;position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .8s}
.bar:after{content:"";position:absolute;left:75%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.45}
.mu{color:var(--mu);font-size:13px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--bd);margin-bottom:8px;background:var(--in)}
.row.me{outline:2px solid var(--ac)}
.rk{width:34px;text-align:center;font-weight:800;font-size:18px}
.grow{flex:1;min-width:150px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:6px;text-align:left;font-size:14px}
td input{margin:0;padding:8px;min-width:70px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0 0 8px}
.hide{display:none}
button.cal{background:var(--in);color:var(--tx);border:1px solid var(--bd);padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;min-height:54px}
.cal small{font-size:10px;color:var(--mu);font-weight:500}.cal.sel{outline:2px solid var(--ac)}.cal.td{border-color:var(--ac2)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal i{display:flex;gap:3px;height:7px}.cal u{width:7px;height:7px;border-radius:50%;display:block}.cal u.g{background:var(--ok)}.cal u.r{background:var(--bad)}
.ov{position:fixed;inset:0;background:rgba(5,8,25,.6);display:grid;place-items:center;padding:16px;z-index:50}
.mdl{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;width:100%;max-width:460px;max-height:85vh;overflow:auto}.mdl .card{border:0;box-shadow:none;padding:0;margin:0!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw;text-align:center}.toast.bad{background:var(--bad)}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden}
input,select,textarea{min-width:0;max-width:100%}
input[type=date]{min-height:48px}
.tabs{-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.calg>*{min-width:0}
.mdl{max-height:85dvh;-webkit-overflow-scrolling:touch}
@media (max-width:480px){
.wrap{padding:12px}
.card{padding:14px;border-radius:16px}
.auth{margin-top:3vh}
.hero{justify-content:center;text-align:center}
.grid{grid-template-columns:1fr}
.row{padding:10px}
.row>button{flex:1 1 auto}
.rk{width:28px}
.calg{gap:3px}
button.cal{min-height:50px}
.cal small{font-size:9px}
h2{font-size:20px}
}
</style></head><body><div class="wrap" id="root"></div>
<script>
const K="attendx.v1",TH=75,OWNER_KEY="shades",OWNER_PW="Shad@8010";
const seed=()=>({subjects:[{n:"Mathematics",h:40},{n:"Physics",h:36},{n:"Chemistry",h:32},{n:"Programming",h:44},{n:"English",h:24}],
students:{"101":{name:"Aarav Mehta",att:{Mathematics:36,Physics:30,Chemistry:27,Programming:40,English:21}},
"102":{name:"Diya Sharma",att:{Mathematics:30,Physics:24,Chemistry:22,Programming:35,English:17}},
"103":{name:"Rohan Patil",att:{Mathematics:27,Physics:25,Chemistry:20,Programming:30,English:16}},
"104":{name:"Sneha Iyer",att:{Mathematics:38,Physics:33,Chemistry:29,Programming:42,English:23}},
"105":{name:"Kabir Singh",att:{Mathematics:22,Physics:20,Chemistry:18,Programming:28,English:14}}},issues:[]});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D)D=seed();
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
if(!D.tt)D.tt={1:["Mathematics","Physics","Programming"],2:["Chemistry","English","Mathematics"],3:["Physics","Programming","Chemistry"],4:["Mathematics","English","Programming"],5:["Physics","Chemistry","English"],6:["Programming"]};
if(!D.cr)D.cr=["102","104"];if(!D.ov)D.ov={};if(D.showCR===undefined)D.showCR=false;if(!D.admins)D.admins={};if(!D.direct)D.direct=[];if(!D.reqs)D.reqs=[];if(!D.notices)D.notices=[{id:1,t:"Welcome to AttendX",m:"Mark your daily attendance in the Daily tab and keep above 75%.",d:new Date().toLocaleDateString(),by:"Admin"}];
const wd=d=>new Date(d+"T00:00:00").getDay(),cls=d=>{const c={};return(D.ov[d]||D.tt[wd(d)]||[]).filter(n=>D.subjects.some(x=>x.n==n)).map(n=>{c[n]=(c[n]||0)+1;return c[n]>1?n+"#"+c[n]:n})};
const week=()=>{const b=new Date(dt+"T00:00:00");b.setDate(b.getDate()-((b.getDay()+6)%7));return[0,1,2,3,4,5].map(k=>{const z=new Date(b);z.setDate(b.getDate()+k);return new Date(z.getTime()-z.getTimezoneOffset()*6e4).toISOString().slice(0,10)})};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
let me=null,tab="mine",err="",mode="in",admin=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sa=(r,n)=>{const s=D.students[r],x=D.subjects.find(z=>z.n==n);let a=Math.min(s.att[n]||0,x.h),h=x.h;Object.values(s.log||{}).forEach(d=>Object.entries(d).forEach(([k,v])=>{if(k.split("#")[0]==n){h++;if(v===1)a++}}));return{a,h}};
const stat=(r)=>{let a=0,h=0;D.subjects.forEach(x=>{const q=sa(r,x.n);a+=q.a;h+=q.h});return{a,h,p:h?a/h*100:0}};
const today=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);let dt=today;
const need=(a,h)=>Math.max(0,Math.ceil(3*h-4*a)),skip=(a,h)=>Math.max(0,Math.floor((4*a-3*h)/3));
const col=p=>p>=TH?"var(--ok)":p>=65?"var(--warn)":"var(--bad)";
function ring(p){const r=58,c=2*Math.PI*r;return`<div class="ring"><svg width="140" height="140" viewBox="0 0 140 140"><defs><linearGradient id="g"><stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${p>=TH?"url(#g)":col(p)}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 70 70)"/></svg><b>${p.toFixed(1)}%</b></div>`}
function head(t){return`<div class="top"><div><div class="logo">AttendX</div><div class="mu">${t}</div></div><button class="ghost sm" onclick="out()">Log out</button></div>`}
function out(){U=[];modal=0;owner=false;me=null;admin=false;tab="mine";err="";draw()}
function authView(){return`<div class="auth card"><div class="logo" style="font-size:30px">AttendX</div><p class="mu" style="margin:4px 0 16px">Track attendance. Stay above ${TH}%. Beat the leaderboard.</p>
<div class="tabs"><button class="tab ${mode=="in"?"on":""}" onclick="mode='in';err='';draw()">Sign in</button><button class="tab ${mode=="up"?"on":""}" onclick="mode='up';err='';draw()">Sign up</button></div>
${mode=="up"?`<label>Name (display only)</label><input id="nm" placeholder="Your full name">`:""}
<label>${mode=="up"?"Username (roll no)":"Username (roll no / admin id)"}</label><input id="un" placeholder="e.g. 106" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
<label>Password ${mode=="up"?"(same as roll no)":""}</label><input id="pw" type="password" placeholder="••••••" autocomplete="current-password" autocapitalize="none">
<p class="err">${err}</p><button class="full" onclick="go()">${mode=="in"?"Sign in":"Create account"}</button>
${mode=="in"?`<p class="mu">Demo: <b>101</b>/<b>101</b> · CR demo: <b>102</b>/<b>102</b></p>`:`<p class="mu">Password must be the same as your roll number.</p>`}</div>`}
function go(){const u=$("#un").value.trim(),p=$("#pw").value.trim();err="";
const A=D.admins[u],own=u.toLowerCase()==OWNER_KEY&&p==(D.opw||OWNER_PW);if(mode=="in"&&(own||(A&&A.pw==p))){admin=true;owner=own;adm=own?"Owner":A.name;tab="stu";sel=Object.keys(D.students)[0]||""}
else if(mode=="in"){const s=D.students[u];if(s&&p==(s.pw||u))me=u;else err="Invalid roll no or password."}
else{const n=$("#nm").value.trim();if(!n||!u||!p)err="Fill all three fields.";else if(p!==u)err="Password must equal your roll number.";else if(D.students[u]||D.admins[u]||u.toLowerCase()==OWNER_KEY)err="This username is already taken.";else{D.students[u]={name:n,att:{}};save();me=u}}
draw()}
function studentView(){const s=D.students[me],t=stat(me);
let h=head(`Hi, ${esc(s.name)} · Roll ${me}${isCR()?" · CR ⭐":""}`)+`<div class="tabs">${[["mine","My attendance"],["day","Daily"],["lb","Leaderboard"],["not","Notices"],...(isCR()?[["cr","CR requests"]]:[]),["rep","Report issue"],["pw","Password"]].map(x=>`<button class="tab ${tab==x[0]?"on":""}" onclick="tab='${x[0]}';draw()">${x[1]}</button>`).join("")}</div>`;
if(tab=="mine"){h+=`<div class="card hero">${ring(t.p)}<div><h2>Overall attendance</h2><p class="mu">${t.a} of ${t.h} classes attended (all subjects combined)</p>
${t.p>=TH?`<span class="pill ok">Safe · can skip ${skip(t.a,t.h)} more</span>`:`<span class="pill bad">Attend next ${need(t.a,t.h)} classes to reach ${TH}%</span>`}</div></div><div class="grid">`+
D.subjects.map(x=>{const q=sa(me,x.n),a=q.a,H=q.h,p=H?a/H*100:0;return`<div class="sub"><div style="display:flex;justify-content:space-between"><b>${esc(x.n)}</b><b style="color:${col(p)}">${p.toFixed(1)}%</b></div><div class="bar"><i style="width:${p}%;background:${col(p)}"></i></div><div class="mu">${a}/${H} classes</div>
<div style="margin-top:6px">${p>=TH?`<span class="pill ok">Can miss ${skip(a,H)} more</span>`:`<span class="pill bad">Need ${need(a,H)} more classes</span>`}</div></div>`}).join("")+`</div><p class="mu">The thin line on each bar marks ${TH}%.</p>`}
if(tab=="day")h+=dayBody(me,1)+dayCard(me);if(tab=="not")h+=noticeList()+(D.showCR&&D.cr.length?`<div class="card" style="margin-top:12px"><h3 style="margin-bottom:10px">⭐ Class representatives</h3>${D.cr.filter(r=>D.students[r]).map(r=>`<span class="pill ok" style="margin:3px">${esc(D.students[r].name)}</span>`).join("")}</div>`:"");if(tab=="cr")h+=crView();
if(tab=="lb"){const L=Object.keys(D.students).map(r=>({r,n:D.students[r].name,p:stat(r).p})).sort((a,b)=>b.p-a.p);
h+=`<div class="card"><h2 style="margin-bottom:12px">🏆 Leaderboard</h2>`+L.map((x,i)=>`<div class="row ${x.r==me?"me":""}"><div class="rk">${["🥇","🥈","🥉"][i]||i+1}</div><div class="grow"><b>${esc(x.n)}</b>${x.r==me?" (you)":""}${D.showCR&&D.cr.includes(x.r)?` <span class="pill ok">⭐ CR</span>`:""}<div class="bar" style="margin:6px 0 0"><i style="width:${x.p}%;background:${col(x.p)}"></i></div></div><b style="color:${col(x.p)}">${x.p.toFixed(1)}%</b></div>`).join("")+`</div>`}
if(tab=="pw")h+=pwCard();
if(tab=="rep"){h+=`<div class="card"><h2>Report an issue to admin</h2><p class="mu">Wrong count? Missing class? Tell the admin.</p><label>Subject</label><select id="is">${D.subjects.map(x=>`<option>${esc(x.n)}</option>`).join("")}<option>General</option></select><label>What’s wrong?</label><textarea id="im" rows="4" placeholder="e.g. I attended the 12 Oct Physics lab but it’s not counted"></textarea><p class="err">${err}</p><button onclick="rep()">Send to admin</button></div>`}
return h}
function rep(){const m=$("#im").value.trim();if(!m){err="Please describe the issue.";return draw()}D.issues.unshift({id:Date.now(),r:me,n:D.students[me].name,s:$("#is").value,m,t:new Date().toLocaleString(),d:0});save();err="";tab="mine";alert("Sent to admin ✔");draw()}
const pwCard=()=>`<div class="card"><h2>Change password</h2><p class="mu">Choose a new password (at least 4 characters). Use it from your next sign-in.</p><label>Current password</label><input id="cp" type="password" autocomplete="current-password"><label>New password</label><input id="np" type="password" autocomplete="new-password"><label>Confirm new password</label><input id="np2" type="password" autocomplete="new-password"><p class="err">${err}</p><button onclick="chgPw()">Update password</button></div>`;
function chgPw(){const c=$("#cp").value.trim(),n=$("#np").value.trim(),n2=$("#np2").value.trim();err="";
const A=admin&&!owner?Object.values(D.admins).find(z=>z.name==adm):null;
const cur=!admin?(D.students[me].pw||me):owner?(D.opw||OWNER_PW):A.pw;
if(c!=cur)err="Current password is wrong.";else if(n.length<4)err="New password must be at least 4 characters.";else if(n!=n2)err="New passwords don't match.";else if(n==c)err="New password must be different.";
else{if(!admin)D.students[me].pw=n;else if(owner)D.opw=n;else A.pw=n;save();err="";return toast("Password updated ✔")}draw()}
let sel="";
function adminView(){let h=head(owner?"Owner panel":"Admin panel · "+esc(adm))+`<div class="tabs">${[["stu","Classes & students"],["tt","Timetable"],["rq","Requests ("+D.reqs.filter(q=>q.s=="p").length+")"],["nt","Notices"],["iss","Issues ("+D.issues.filter(i=>!i.d).length+")"],["pw","Password"],...(owner?[["adm","Admins"]]:[])].map(x=>`<button class="tab ${tab==x[0]?"on":""}" onclick="tab='${x[0]}';draw()">${x[1]}</button>`).join("")}</div>`;
if(tab=="stu"){const s=D.students[sel];
h+=`<div class="card"><h3>Subjects & classes held (before daily tracking)</h3><div class="tbl"><table>${D.subjects.map((x,i)=>`<tr><td><b>${esc(x.n)}</b></td><td><input type="number" min="0" value="${x.h}" onchange="D.subjects[${i}].h=Math.max(0,+this.value);save();draw()"></td><td><button class="danger sm" onclick="delSub(${i})">Delete</button></td></tr>`).join("")}</table></div>
<div style="display:flex;gap:8px;margin-top:10px"><input id="ns" placeholder="New subject name" style="margin:0"><button onclick="addSub()">Add</button></div></div>
${crCard()}<div class="card" style="margin-top:12px"><h3>Edit student attendance (before daily tracking)</h3><label>Student</label><select onchange="sel=this.value;draw()">${Object.keys(D.students).map(r=>`<option value="${r}" ${r==sel?"selected":""}>${r} · ${esc(D.students[r].name)}${D.cr.includes(r)?" ⭐ CR":""}</option>`).join("")}</select>
${s?`<p class="mu">Overall: <b>${stat(sel).p.toFixed(1)}%</b>${D.cr.includes(sel)?` <span class="pill ok">CR</span>`:""}${D.direct.includes(sel)?` <span class="pill ok">Direct power</span>`:""}</p><div class="tbl"><table>${D.subjects.map(x=>`<tr><td>${esc(x.n)}</td><td><input type="number" min="0" max="${x.h}" value="${s.att[x.n]||0}" onchange="D.students['${sel}'].att['${x.n.replace(/'/g,"\\'")}']=Math.min(${x.h},Math.max(0,+this.value));save();draw()"></td><td class="mu">/ ${x.h}</td></tr>`).join("")}</table></div><button class="danger sm" style="margin-top:10px" onclick="delStu()">Remove student</button> <button class="sm" style="margin-top:10px" onclick="togCR()">${D.cr.includes(sel)?"Remove CR":"Make CR"}</button>${D.cr.includes(sel)?` <button class="sm ${D.direct.includes(sel)?"danger":"ghost"}" style="margin-top:10px" onclick="togDP()">${D.direct.includes(sel)?"Take back direct power":"Give direct power"}</button>`:""}`:""}</div>`+(s?dayBody(sel,1)+dayCard(sel):"")}
if(tab=="tt"){h+=`<div class="card"><h2>Weekly timetable</h2><p class="mu">Enter how many lectures of each subject are held each day (0 = none). Students only see these.</p><div class="tbl"><table><tr><th></th>${D.subjects.map(x=>`<th>${esc(x.n)}</th>`).join("")}</tr>${[1,2,3,4,5,6].map(d=>`<tr><td><b>${DAYS[d].slice(0,3)}</b></td>${D.subjects.map((x,i)=>`<td><input type="number" min="0" max="6" style="margin:0;padding:8px;min-width:56px" value="${(D.tt[d]||[]).filter(z=>z==x.n).length}" onchange="tc(${d},${i},this.value)"></td>`).join("")}</tr>`).join("")}</table></div></div>${admForm()}`}
if(tab=="rq"){h+=`<div class="card"><h2 style="margin-bottom:10px">CR requests</h2>`+(D.reqs.length?D.reqs.map(q=>`<div class="row"><div class="grow"><span class="mu">${esc(q.by)} (CR) · ${q.t}</span><div>${reqTxt(q)}</div></div>${q.s=="p"?`<button class="pr sm" onclick="dec(${q.id},1)">Approve</button><button class="ab sm" onclick="dec(${q.id},0)">Reject</button>`:`<span class="pill ${q.s=="ok"?"ok":"bad"}">${q.s=="ok"?"Approved":"Rejected"}</span>`}</div>`).join(""):`<p class="mu">No requests.</p>`)+`</div>`}
if(tab=="nt"){h+=`<div class="card"><h2>Post a notice</h2><label>Title</label><input id="nt"><label>Message</label><textarea id="nm2" rows="3"></textarea><button onclick="postN()">Publish</button></div><div style="margin-top:12px">${noticeList(1)}</div>`}
if(tab=="adm"&&owner){h+=`<div class="card"><h2>Create admin</h2><p class="mu">Give someone a username and password. They sign in on the normal login page and get this same admin panel.</p><label>Name</label><input id="an" placeholder="Their name"><label>Username</label><input id="au" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Password</label><input id="ap" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><p class="err">${err}</p><button onclick="addAdm()">Create admin</button></div><div class="card" style="margin-top:12px"><h3 style="margin-bottom:10px">Admins (${Object.keys(D.admins).length})</h3>`+(Object.keys(D.admins).length?Object.keys(D.admins).map(u=>`<div class="row"><div class="grow"><b>${esc(D.admins[u].name)}</b> <span class="mu">· ${esc(u)}</span></div><button class="danger sm" onclick="delAdm('${u}')">Remove</button></div>`).join(""):`<p class="mu">No other admins yet.</p>`)+`</div>`}
if(tab=="pw")h+=pwCard();
if(tab=="iss"){h+=`<div class="card"><h2 style="margin-bottom:10px">Issues from students</h2>`+(D.issues.length?D.issues.map(i=>`<div class="row"><div class="grow"><b>${esc(i.n)}</b> <span class="mu">(${i.r}) · ${esc(i.s)} · ${i.t}</span><div>${esc(i.m)}</div></div>${i.d?`<span class="pill ok">Done</span>`:`<button class="sm" onclick="D.issues.find(z=>z.id==${i.id}).d=1;save();draw()">Resolve</button>`}</div>`).join(""):`<p class="mu">No issues yet 🎉</p>`)+`</div>`}
return h}
let cm=today.slice(0,7),modal=0,tm=null,tk=0,lt="";
const dl=q=>q.date?DAYS[wd(q.date)]+", "+q.date+" only":(DAYS[q.d]||"");
const crCard=()=>`<div class="card" style="margin-top:12px"><h3 style="margin-bottom:10px">⭐ Class representatives (${D.cr.length})</h3><button class="sm ${D.showCR?"":"ghost"}" onclick="D.showCR=!D.showCR;save();toast(D.showCR?'CRs are now visible to students ✔':'CRs are hidden from students ✔')">${D.showCR?"👁 Visible to students – tap to hide":"🙈 Hidden from students – tap to show"}</button><div style="height:10px"></div>`+(D.cr.filter(r=>D.students[r]).length?D.cr.filter(r=>D.students[r]).map(r=>`<div class="row" style="cursor:pointer" onclick="sel='${r}';draw()"><div class="grow"><b>${esc(D.students[r].name)}</b> <span class="mu">· ${r}</span></div><span class="pill ok">⭐ CR</span>${D.direct.includes(r)?`<span class="pill ok">Direct power</span>`:""}</div>`).join(""):`<p class="mu">No CRs yet. Select a student below and tap Make CR.</p>`)+`</div>`;
function applyReq(q){if(q.k=="mv"){const F=[...(D.ov[q.date]||D.tt[wd(q.date)]||[])];D.ov[q.date2]=F;D.ov[q.date]=[];return}const L=[...(q.date?(D.ov[q.date]||D.tt[wd(q.date)]||[]):(D.tt[q.d]||[]))],R=q.k=="add"?[...L,q.sub]:q.k=="rep"?L.map((z,j)=>j==L.indexOf(q.old)?q.sub:z):L.filter((z,j)=>j!=L.indexOf(q.sub));if(q.date)D.ov[q.date]=R;else D.tt[q.d]=R}
function cancelReq(id){const q=D.reqs.find(z=>z.id==id);if(!q||q.s!="p"||q.r!=me)return;D.reqs=D.reqs.filter(z=>z.id!=id);save();toast("Request cancelled")}
function setDP(v){if(!sel)return;const n=D.students[sel].name;if(!D.cr.includes(sel))return toast("Make "+n+" a CR first",1);const has=D.direct.includes(sel);if(v){if(has)return toast(n+" already has direct power",1);D.direct.push(sel);save();toast("Direct power given to "+n+" ✔")}else{if(!has)return toast(n+" has no direct power",1);D.direct=D.direct.filter(z=>z!=sel);save();toast("Direct power removed from "+n+" ✔")}}
let owner=false,adm="";
function addAdm(){const nm=$("#an").value.trim(),u=$("#au").value.trim(),p=$("#ap").value.trim();err="";if(!nm||!u||!p)err="Fill name, username and password.";else if(D.students[u]||D.admins[u]||u.toLowerCase()==OWNER_KEY)err="That username is already used.";else{D.admins[u]={name:nm,pw:p};save();return toast(nm+" is now an admin ✔")}draw()}
function delAdm(u){if(!confirm("Remove this admin?"))return;const nm=D.admins[u].name;delete D.admins[u];save();toast(nm+" removed as admin ✔")}
const chgForm=()=>`<label>What do you want to change?</label><select id="rt"><option value="add">Add a lecture to a day</option><option value="rem">Remove a lecture from a day</option><option value="rep">Replace a lecture on a day</option><option value="mv">Shift a whole day to another day</option></select><label>Date (change applies to this day only)</label><input type="date" id="rd" value="${today}"><label>Move that day’s lectures to (only for Shift)</label><input type="date" id="rd2"><label>Subject (to add / remove / new lecture)</label><select id="rs">${D.subjects.map(x=>`<option>${esc(x.n)}</option>`).join("")}</select><label>Lecture being replaced (only for Replace)</label><select id="ro">${D.subjects.map(x=>`<option>${esc(x.n)}</option>`).join("")}</select>`;
const ovList=()=>{const ks=Object.keys(D.ov).sort();return`<div class="card" style="margin-top:12px"><h3 style="margin-bottom:10px">Date-specific changes (${ks.length})</h3>`+(ks.length?ks.map(d=>`<div class="row"><div class="grow"><b>${DAYS[wd(d)]}, ${d}</b><div class="mu">${D.ov[d].length?D.ov[d].map(z=>esc(z)).join(", "):"No lectures (holiday)"}</div></div><button class="ghost sm" onclick="resetOv('${d}')">Reset to normal</button></div>`).join(""):`<p class="mu">No special-day changes. The weekly timetable applies every day.</p>`)+`</div>`};
const admForm=()=>`<div class="card" style="margin-top:12px"><h2>Change a specific date</h2><p class="mu">Add, remove or replace a lecture, or shift a whole day. It applies to that date only; the weekly timetable stays the same.</p>${chgForm()}<p class="err">${err}</p><button onclick="admChg()">Apply change</button></div>${ovList()}`;
function admChg(){const k=$("#rt").value,date=$("#rd").value,date2=$("#rd2").value,sub=$("#rs").value,old=$("#ro").value,cur=D.ov[date]||D.tt[wd(date)]||[];err="";
if(!date)err="Pick a date.";else if(k=="mv"&&(!date2||date2==date))err="Pick a different date to move to.";else if(k=="mv"&&!cur.length)err="There are no lectures on that day to move.";else if(k=="rep"&&!cur.includes(old))err=old+" isn’t on "+DAYS[wd(date)]+".";else if(k=="rep"&&sub==old)err="Pick a different lecture to replace it with.";else if(k=="rem"&&!cur.includes(sub))err="That class isn’t on "+DAYS[wd(date)]+".";
else{applyReq({k,date,date2,sub,old});save();return toast("Change applied for "+date+" only ✔")}draw()}
function resetOv(d){delete D.ov[d];save();toast("Timetable restored for "+d+" ✔")}
function toast(t,bad){tm={t,bad};draw();clearTimeout(tk);tk=setTimeout(()=>{tm=null;const e=$(".toast");if(e)e.remove()},3000)}
function dayCard(r){const s=D.students[r],[y,m]=cm.split("-").map(Number),dim=new Date(y,m,0).getDate(),off=(new Date(y,m-1,1).getDay()+6)%7,G=s.log||{};let c="";for(let i=0;i<off;i++)c+="<div></div>";
for(let d=1;d<=dim;d++){const x=`${cm}-${String(d).padStart(2,"0")}`,k=cls(x).length,v=Object.values(G[x]||{}),p=v.filter(z=>z===1).length;c+=`<button class="cal ${x==dt?"sel":""} ${x==today?"td":""}" style="${k?"":"opacity:.5"}" onclick="dt='${x}';modal=1;draw()"><b>${d}</b><small>${k?k+" cls":"–"}</small><i>${p?`<u class="g"></u>`:""}${v.length-p?`<u class="r"></u>`:""}</i></button>`}
return`<div class="card" style="margin-top:12px"><div class="top"><button class="ghost sm" onclick="mv(-1)">‹</button><h3>${new Date(y,m-1,1).toLocaleString("en",{month:"long"})} ${y}</h3><button class="ghost sm" onclick="mv(1)">›</button></div><div class="calg">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<span class="mu" style="text-align:center;font-size:12px">${x}</span>`).join("")}${c}</div><p class="mu">Tap a date to see its classes and mark attendance. <span class="pill ok">● present</span> <span class="pill bad">● absent</span></p></div>`+(modal?`<div class="ov" onclick="if(event.target==this){modal=0;draw()}"><div class="mdl"><button class="ghost sm" style="float:right" onclick="modal=0;draw()">✕ Close</button>${dayBody(r)}</div></div>`:"")}
function mv(n){const[y,m]=cm.split("-").map(Number),z=new Date(y,m-1+n,1);cm=z.getFullYear()+"-"+String(z.getMonth()+1).padStart(2,"0");draw()}
function dayBody(r,f){const s=D.students[r],L=(s.log||{})[dt]||{},ds=Object.keys(s.log||{}).filter(d=>Object.keys(s.log[d]).length).sort().reverse().slice(0,7);
return`<div class="card" style="margin-top:12px"><h3>📅 ${DAYS[wd(dt)]} · ${dt}</h3><p class="mu" style="margin:4px 0 12px">${cls(dt).length?cls(dt).length+" lecture(s) scheduled":"No lectures scheduled"}${dt>today?" · future date, can’t be marked yet":""}</p>${f?`<div class="tabs">${week().map(d=>`<button class="tab sm ${d==dt?"on":""}" onclick="dt='${d}';draw()">${DAYS[wd(d)].slice(0,3)} ${d.slice(8)}</button>`).join("")}</div><label>Date</label><input type="date" value="${dt}" max="${today}" onchange="dt=this.value||today;draw()">`:""}
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="pr" onclick="mark('${r}',1)">✅ All classes present</button><button class="ab" onclick="mark('${r}',0)">✖ All absent</button><button class="ghost" onclick="mark('${r}',-1)">Clear day</button><button class="un" ${U.length?"":"disabled"} onclick="undo()">↩ Undo</button></div>`+
(cls(dt).length?cls(dt).map((k,i)=>`<div class="row"><div class="grow"><b>${esc(k.split("#")[0])}</b>${k.includes("#")?` <span class="mu">· lecture ${k.split("#")[1]}</span>`:""}</div><button class="sm pr ${L[k]===1?"":"o"}" onclick="mk('${r}',${i},1)">✔ Present</button><button class="sm ab ${L[k]===0?"":"o"}" onclick="mk('${r}',${i},0)">✖ Absent</button></div>`).join(""):`<p class="mu">No classes on ${DAYS[wd(dt)]} 🎉</p>`)+
(f&&ds.length?`<p class="mu" style="margin-top:14px">Recent days (tap to open)</p>`+ds.map(d=>{const v=Object.values(s.log[d]),p=v.filter(z=>z===1).length;return`<div class="row" style="cursor:pointer" onclick="dt='${d}';draw()"><b class="grow">${d}</b><span class="pill ok">${p} present</span><span class="pill bad">${v.length-p} absent</span></div>`}).join(""):"")+`</div>`}
let U=[];const snap=r=>{U.push({r,l:JSON.stringify(D.students[r].log||{})});if(U.length>30)U.shift()};
function undo(){const u=U.pop();if(!u||!D.students[u.r])return;D.students[u.r].log=JSON.parse(u.l);save();draw()}
function mk(r,i,v){if(dt>today)return;const s=D.students[r],n=cls(dt)[i];snap(r);s.log=s.log||{};const L=s.log[dt]=s.log[dt]||{};if(L[n]===v)delete L[n];else L[n]=v;if(!Object.keys(L).length)delete s.log[dt];save();draw()}
function mark(r,v){if(dt>today)return;const s=D.students[r];snap(r);s.log=s.log||{};if(v<0)delete s.log[dt];else{const L={};cls(dt).forEach(n=>L[n]=v);s.log[dt]=L}save();draw()}
const isCR=()=>D.cr.includes(me);
const reqTxt=q=>q.k=="mv"?`Shift all lectures of <b>${q.date}</b> (${DAYS[wd(q.date)]}) to <b>${q.date2}</b> (${DAYS[wd(q.date2)]})${q.n?" – "+esc(q.n):""}`:q.k=="rep"?`Replace <b>${esc(q.old)}</b> with <b>${esc(q.sub)}</b> on <b>${dl(q)}</b>${q.n?" – "+esc(q.n):""}`:q.k=="not"?`Notice: <b>${esc(q.n)}</b>${q.m?" – "+esc(q.m):""}`:`${q.k=="add"?"Add":"Remove"} <b>${esc(q.sub)}</b> ${q.k=="add"?"to":"from"} <b>${dl(q)}</b>${q.n?" – "+esc(q.n):""}`;
const noticeList=ad=>`<div class="card"><h2 style="margin-bottom:10px">📢 Notices</h2>`+(D.notices.length?D.notices.map(n=>`<div class="row"><div class="grow"><b>${esc(n.t)}</b> <span class="mu">· ${esc(n.d)} · ${esc(n.cr&&!ad&&!D.showCR?"Class notice":n.cr?n.by+" (CR)":(n.by||"Admin"))}</span><div>${esc(n.m)}</div></div>${ad?`<button class="danger sm" onclick="D.notices=D.notices.filter(z=>z.id!=${n.id});save();draw()">Delete</button>`:""}</div>`).join(""):`<p class="mu">No notices.</p>`)+`</div>`;
function crView(){const mine=D.reqs.filter(q=>q.r==me);return`<div class="card"><h2>CR requests</h2><p class="mu">Ask the admin to change the timetable. It goes live only after approval, and class changes apply to the chosen date only.</p>${D.direct.includes(me)?`<p><span class="pill ok">Direct power: your changes apply instantly</span></p>`:""}<label>Request type</label><select id="rt"><option value="add">Add a class to a day</option><option value="rem">Remove a class from a day</option><option value="rep">Replace a lecture on a day</option><option value="mv">Shift a whole day to another day</option></select><label>Date (change applies to this day only)</label><input type="date" id="rd" value="${today}"><label>Move that day’s lectures to (only for Shift)</label><input type="date" id="rd2"><label>Subject (to add / remove / new lecture)</label><select id="rs">${D.subjects.map(x=>`<option>${esc(x.n)}</option>`).join("")}</select><label>Lecture being replaced (only for Replace)</label><select id="ro">${D.subjects.map(x=>`<option>${esc(x.n)}</option>`).join("")}</select><label>Reason (optional)</label><input id="rn" placeholder="e.g. holiday, teacher on leave"><p class="err">${err}</p><button onclick="sendReq()">${D.direct.includes(me)?"Apply now":"Send to admin"}</button></div><div class="card" style="margin-top:12px"><h2>Post a notice</h2><label>Title</label><input id="nt"><label>Message</label><textarea id="nm2" rows="3"></textarea><button onclick="postN()">${D.direct.includes(me)?"Publish":"Send"}</button></div><div class="card" style="margin-top:12px"><h3 style="margin-bottom:10px">My requests</h3>`+(mine.length?mine.map(q=>`<div class="row"><div class="grow">${reqTxt(q)}</div><span class="pill ${q.s=="ok"?"ok":q.s=="no"?"bad":""}">${q.s=="ok"?"Approved":q.s=="no"?"Rejected":"Pending"}</span>${q.s=="p"?`<button class="ghost sm" onclick="cancelReq(${q.id})">Cancel</button>`:""}</div>`).join(""):`<p class="mu">Nothing yet.</p>`)+`</div>`}
function sendReq(){const k=$("#rt").value,date=$("#rd").value,date2=$("#rd2").value,sub=$("#rs").value,n=$("#rn").value.trim(),m="",old=$("#ro").value,cur=D.ov[date]||D.tt[wd(date)]||[],on=cur.includes(sub),oo=cur.includes(old);err="";
if(!date)err="Pick a date.";else if(k=="mv"&&(!date2||date2==date))err="Pick a different date to move to.";else if(k=="mv"&&!cur.length)err="There are no lectures on that day to move.";else if(k=="not"&&!n)err="Add a title for the notice.";else if(k=="rep"&&!oo)err=old+" isn’t on "+DAYS[wd(date)]+".";else if(k=="rep"&&sub==old)err="Pick a different lecture to replace it with.";else if(k=="rem"&&!on)err="That class isn’t on "+DAYS[wd(date)]+".";
else{const q={id:Date.now(),r:me,by:D.students[me].name,k,date,date2,sub,old,n,m,s:"p",t:new Date().toLocaleDateString()};if(D.direct.includes(me)){q.auto=1;D.reqs.unshift(q);dec(q.id,1);return toast("Applied directly ✔")}D.reqs.unshift(q);save();toast("Request sent to admin ✔")}draw()}
function dec(id,ok){const q=D.reqs.find(z=>z.id==id);q.s=ok?"ok":"no";if(ok){if(q.k=="not")D.notices.unshift({id:Date.now(),t:q.n,m:q.m,d:new Date().toLocaleDateString(),by:q.by,cr:1});else applyReq(q)}save();draw()}
function tc(d,i,v){const n=D.subjects[i].n,L=(D.tt[d]||[]).filter(z=>z!=n);for(let k=0;k<Math.min(6,Math.max(0,+v||0));k++)L.push(n);D.tt[d]=L;save()}
function postN(){const t=$("#nt").value.trim(),m=$("#nm2").value.trim();if(!t)return toast("Add a title",1);const dd=new Date().toLocaleDateString();if(admin){D.notices.unshift({id:Date.now(),t,m,d:dd,by:"Admin"});save();return toast("Notice published ✔")}const q={id:Date.now(),r:me,by:D.students[me].name,k:"not",n:t,m,s:"p",t:dd};D.reqs.unshift(q);if(D.direct.includes(me)){q.auto=1;dec(q.id,1);return toast("Notice published ✔")}save();toast("Notice sent to admin ✔")}
function togCR(){setCR(D.cr.includes(sel)?0:1)}
function togDP(){setDP(D.direct.includes(sel)?0:1)}
function setCR(v){if(!sel)return;const n=D.students[sel].name,has=D.cr.includes(sel);if(v){if(has)return toast(n+" is already a CR",1);D.cr.push(sel);save();toast(n+" added as CR ✔")}else{if(!has)return toast(n+" is not a CR",1);D.cr=D.cr.filter(z=>z!=sel);D.direct=D.direct.filter(z=>z!=sel);save();toast(n+" removed as CR ✔")}}
function addSub(){const n=$("#ns").value.trim();if(n&&!D.subjects.some(x=>x.n==n)){D.subjects.push({n,h:0});save();draw()}}
function delSub(i){if(confirm("Delete this subject?")){D.subjects.splice(i,1);save();draw()}}
function delStu(){if(confirm("Remove this student?")){const nm=D.students[sel].name;delete D.students[sel];D.cr=D.cr.filter(z=>z!=sel);D.direct=D.direct.filter(z=>z!=sel);sel=Object.keys(D.students)[0]||"";save();toast(nm+" removed successfully ✔")}}
function draw(){if(lt!=tab){modal=0;lt=tab}$("#root").innerHTML=(admin?adminView():me?studentView():authView())+(tm?`<div class="toast ${tm.bad?"bad":""}">${esc(tm.t)}</div>`:"")}
draw();
</script></body></html>
